<title>Nitya Quiz Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: class dashboard as home; lesson, quiz and result in one big card; a grown-up panel beside the quiz */
:root {
  --sky: #eef5ff;
  --card: #ffffff;
  --ink: #1d2b4f;
  --muted: #5b6889;
  --blue: #2f6fe4;
  --blue-ink: #ffffff;
  --blue-soft: #e4eeff;
  --sun: #ffc93c;
  --leaf: #1f9a66;
  --leaf-soft: #e2f5eb;
  --coral: #e0703f;
  --coral-soft: #fdeee7;
  --line: #d6e3f5;
  --track: #e8eef8;
  --dot-blue: #3b7bf0;
  --dot-orange: #f08a3c;
  --font-display: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #0f1a2e; --card: #17233b; --ink: #eef3ff; --muted: #a4b1cf; --blue: #6f9bff; --blue-ink: #0f1a2e; --blue-soft: #1e2f52;
    --sun: #ffd25e; --leaf: #4fd39a; --leaf-soft: #173b2e; --coral: #ff9a76; --coral-soft: #3d2620; --line: #2a3a5c; --track: #22314f;
    --dot-blue: #7aa5ff; --dot-orange: #ffa766; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #0f1a2e; --card: #17233b; --ink: #eef3ff; --muted: #a4b1cf; --blue: #6f9bff; --blue-ink: #0f1a2e; --blue-soft: #1e2f52;
  --sun: #ffd25e; --leaf: #4fd39a; --leaf-soft: #173b2e; --coral: #ff9a76; --coral-soft: #3d2620; --line: #2a3a5c; --track: #22314f;
  --dot-blue: #7aa5ff; --dot-orange: #ffa766; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.5; }
.wrap {
  max-width: 1040px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.tag { font-size: 0.85rem; color: var(--muted); }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 18px; align-items: start; }
.stage.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 780px) { .stage { grid-template-columns: 1fr; } }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: clamp(18px, 4vw, 32px); display: grid; gap: 18px; min-width: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); }
h2 { font-size: clamp(1.4rem, 4.2vw, 1.9rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.label { font-size: 0.75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.mascot { display: flex; gap: 14px; align-items: flex-start; }
.mascot svg { flex: none; }
.bubble { background: var(--sky); border-radius: 18px; padding: 12px 16px; min-width: 0; display: grid; gap: 6px; }
.prompt { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.3rem, 4vw, 1.8rem); line-height: 1.25; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.btn {
  font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; min-height: 72px; padding: 8px 16px;
  border-radius: 18px; border: 3px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  transition: transform .12s, border-color .12s;
}
.btn:hover { border-color: var(--blue); transform: translateY(-2px); }
.btn:focus-visible, .ghost:focus-visible, .chipbtn:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.btn[disabled] { cursor: default; transform: none; opacity: .55; }
.btn.right { border-color: var(--leaf); background: var(--leaf-soft); opacity: 1; }
.btn.tried { border-color: var(--coral); background: var(--coral-soft); }
.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); font-size: 1.25rem; min-height: 60px; }
.primary:hover { border-color: var(--blue); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ghost { font-family: var(--font-body); font-weight: 700; font-size: 1rem; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 2px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.feedback { border-radius: 18px; padding: 14px 18px; font-size: 1.05rem; }
.feedback.good { background: var(--leaf-soft); }
.feedback.gentle { background: var(--coral-soft); }
.feedback b { font-family: var(--font-display); font-size: 1.25rem; }
.visual { display: flex; justify-content: center; }
.visual svg { max-width: 100%; height: auto; }

/* Marks bar */
.marks { display: grid; gap: 8px; padding: 14px 16px; border-radius: 18px; background: var(--sky); }
.marks-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.marks-num { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
.delta { display: inline-block; margin-left: 8px; font-weight: 700; font-size: 1rem; padding: 2px 10px; border-radius: 999px; }
.delta.up { background: var(--leaf-soft); color: var(--leaf); }
.delta.down { background: var(--coral-soft); color: var(--coral); }
.track { position: relative; height: 22px; border-radius: 999px; background: var(--track); margin-top: 18px; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--blue); transition: width .6s cubic-bezier(.3, 1.4, .5, 1), background .3s; }
.fill.qualified { background: var(--leaf); }
.passmark { position: absolute; top: -20px; bottom: -6px; width: 0; border-left: 3px dashed var(--ink); }
.passmark span { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 0.8rem; font-weight: 700; background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; line-height: 1.4; }
.passmark.crossed { border-left-color: var(--leaf); }
.passmark.crossed span { border-color: var(--leaf); color: var(--leaf); }
.qual { font-weight: 700; font-size: 0.95rem; }
.qual.yes { color: var(--leaf); }
.lvl { display: inline-flex; gap: 6px; align-items: center; font-size: 0.85rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--blue-soft); color: var(--ink); }
.lvl i { font-style: normal; color: var(--muted); font-weight: 400; }

/* Grown-up panel */
.side { background: var(--card); border: 2px dashed var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; font-size: 0.95rem; }
.ladder { display: grid; gap: 6px; }
.rung { display: flex; justify-content: space-between; padding: 7px 12px; border-radius: 10px; border: 2px solid var(--line); font-variant-numeric: tabular-nums; }
.rung.on { border-color: var(--blue); background: var(--blue-soft); font-weight: 700; }
.stat { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.tools { display: grid; gap: 8px; padding-top: 10px; border-top: 2px dashed var(--line); }
.tools .ghost { min-height: 40px; font-size: 0.9rem; }
.bankrow { display: grid; gap: 6px; }

/* Dashboard */
.dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.overall { display: grid; gap: 8px; }
.segs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.seg { height: 12px; border-radius: 999px; background: var(--track); }
.seg.cleared { background: var(--leaf); }
.seg.current { background: var(--blue); }
.bigstat { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.topics { display: grid; gap: 10px; }
.topic { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; border: 2px solid var(--line); }
.topic.current { border-color: var(--blue); background: var(--blue-soft); }
.topic.locked { opacity: .6; }
.num { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; background: var(--track); }
.topic.cleared .num { background: var(--leaf); color: var(--card); }
.topic.current .num { background: var(--blue); color: var(--blue-ink); }
.tmain { display: grid; gap: 6px; min-width: 0; }
.tmeta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { font-size: 0.78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); }
.chip.cleared { border-color: var(--leaf); color: var(--leaf); }
.chip.current { border-color: var(--blue); color: var(--blue); }
.mini { position: relative; width: 120px; height: 8px; border-radius: 999px; background: var(--track); }
.mini b { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--blue); }
.mini b.ok { background: var(--leaf); }
.mini i { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--ink); }
.stars-sm { color: var(--sun); letter-spacing: .05em; }
.chipbtn { font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 2px solid var(--blue); background: var(--blue); color: var(--blue-ink); cursor: pointer; }
.chipbtn.soft { background: transparent; color: var(--ink); border-color: var(--line); }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.panel { border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.area { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.area .mini { width: 100%; grid-column: 1 / -1; }
.lvlrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.lvlrow .mini { width: 100%; }
.stars { font-family: var(--font-display); font-size: 3rem; color: var(--sun); letter-spacing: .1em; line-height: 1; }
.cert { border: 3px solid var(--sun); border-radius: 24px; padding: 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
@media (max-width: 520px) {
  .topic { grid-template-columns: 40px minmax(0, 1fr); }
  .topic .act { grid-column: 1 / -1; }
  .topic .act .chipbtn { width: 100%; }
}

/* Sign-in, consent, PIN, profiles and onboarding */
.narrow { max-width: 560px; margin: 0 auto; width: 100%; display: grid; gap: 18px; }
.hero { display: grid; justify-items: center; text-align: center; gap: 10px; }
.wide { width: 100%; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.9rem; }
.or::before, .or::after { content: ""; flex: 1; border-top: 2px solid var(--line); }
form { display: grid; gap: 10px; }
label { font-weight: 700; }
input[type="email"], input[type="text"] {
  font: inherit; font-size: 1.15rem; min-height: 56px; padding: 0 16px; border-radius: 14px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 100%;
}
input:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.error { color: var(--coral); font-weight: 700; }
.note { background: var(--sky); border-radius: 14px; padding: 12px 14px; font-size: 0.95rem; }
.points { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; cursor: pointer; }
.check input { width: 26px; height: 26px; flex: none; margin-top: 2px; accent-color: var(--blue); }
.pin-dots { display: flex; justify-content: center; gap: 16px; }
.pin-dots span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); }
.pin-dots span.on { background: var(--ink); }
.pinpad { display: grid; grid-template-columns: repeat(3, minmax(0, 88px)); justify-content: center; gap: 12px; }
.pinpad .btn { min-height: 64px; font-size: 1.6rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.choices.avatars { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices .btn { min-height: 80px; }
.choices .btn.on { border-color: var(--blue); background: var(--blue-soft); }
.choices .btn small { display: block; font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.emoji { font-size: 2.4rem; line-height: 1; }
.steps { display: flex; gap: 6px; }
.steps span { flex: 1; height: 8px; border-radius: 999px; background: var(--track); }
.steps span.on { background: var(--blue); }
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 180px)); gap: 14px; }
.kid { display: grid; justify-items: center; gap: 6px; padding: 18px 12px; min-height: 150px; }
.kid .emoji { font-size: 3.2rem; }
.who { display: flex; align-items: center; gap: 10px; }
.who .emoji { font-size: 2rem; }
.family { display: grid; gap: 10px; }
.member { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; align-items: center; padding: 12px 14px; border: 2px solid var(--line); border-radius: 16px; }
.member .row { grid-column: 1 / -1; }
.banner { background: var(--coral-soft); border-radius: 14px; padding: 10px 14px; font-weight: 700; }
pre.data { max-height: 240px; overflow: auto; background: var(--sky); border-radius: 12px; padding: 12px; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; }
@media (max-width: 420px) { .choices.avatars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* New questions, quiz settings and the admin panel */
.act { display: grid; gap: 4px; justify-items: end; }
.linkbtn { font: inherit; font-size: 0.88rem; font-weight: 700; min-height: 36px; padding: 0 6px; border: 0; background: none; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkbtn[disabled] { color: var(--muted); cursor: default; }
.linkbtn:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; border-radius: 6px; }
.settings { display: grid; gap: 12px; }
.setting { border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.setline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper .ghost { min-width: 48px; padding: 0; font-size: 1.3rem; }
.stepper .ghost[disabled] { opacity: .4; cursor: default; }
.stepper b { min-width: 2.2ch; text-align: center; font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs .ghost.on { background: var(--blue-soft); border-color: var(--blue); }
.qcard { border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.optlist { display: flex; gap: 8px; flex-wrap: wrap; }
.optlist span { min-width: 48px; text-align: center; padding: 4px 12px; border-radius: 12px; border: 2px solid var(--line); font-weight: 700; }
.optlist span.ans { border-color: var(--leaf); background: var(--leaf-soft); }
.problems { margin: 0; padding: 10px 14px 10px 32px; border-radius: 14px; background: var(--coral-soft); display: grid; gap: 4px; font-size: 0.95rem; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.nums label { display: grid; gap: 4px; font-size: 0.85rem; }
.limits { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.limits legend { padding: 0; margin-bottom: 4px; font-weight: 700; }
.limits label { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center; font-weight: 400; }
input[type="number"], select {
  font: inherit; font-size: 1.05rem; font-weight: 400; min-height: 48px; padding: 0 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 100%; min-width: 0;
}
select:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }
.log { display: grid; gap: 6px; font-size: 0.88rem; }
.log > div { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) minmax(0, 0.9fr) minmax(0, 1.2fr); gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--sky); font-variant-numeric: tabular-nums; }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 0.95rem; }
.checks .ok { color: var(--leaf); }
.checks .bad { color: var(--coral); font-weight: 700; }
@media (max-width: 520px) {
  .topic .act { justify-items: stretch; }
  .log > div { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .btn, .fill { transition: none; } .btn:hover { transform: none; } }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--blue)"/><text x="20" y="27" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="20" fill="var(--blue-ink)">+</text></svg>
      Nitya
    </div>
    <span class="tag" id="tag"></span>
  </div>
  <div class="stage" id="stage">
    <main class="card" id="screen" aria-live="polite"></main>
    <aside class="side" id="side" aria-label="Grown-up view"></aside>
  </div>
</div>

<script>/*ENGINE*/</script>
<script>/*APP*/</script>
