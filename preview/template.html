<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nitya</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/*
 * Two looks share one layout (cp, 2026-10-25). <html data-look> picks one:
 *   play   bright and game-like, for LKG to Class 5: chunky buttons that press down, a trail of topics, the owl
 *   focus  clean and calm, for Class 6 up and for every grown-up screen: flat cards, rings, A/B/C answer keys
 * Only the tokens and the decoration change, never where things are.
 * Each look has light and dark colours. Light is the default, as in the designs, and
 * the switch in the top bar (<html data-mode="dark">) turns dark on for this device
 * (cp, 2026-10-25). The device's own dark mode doesn't change it.
 */
:root, :root[data-look="play"] {
  --sky: #ddf0ff; --card: #ffffff; --ink: #13234b; --muted: #3f5079;
  --blue: #2563d9; --blue-ink: #ffffff; --blue-soft: #e4eeff; --blue-mid: #a9c9ec;
  --sun: #ffc83d; --sun-soft: #ffe59a; --sun-deep: #d9a21f; --sun-ink: #13234b;
  --leaf: #15803d; --leaf-node: #1e9e5a; --leaf-deep: #146c3e; --leaf-soft: #e2f5eb;
  --coral: #b8432a; --coral-line: #e85a36; --coral-soft: #fff1ea;
  --line: #b8d6f2; --line-soft: #d6e6f7; --track: #e3ecf8; --shadow: #b8d6f2;
  --dot-blue: #2f6fe4; --dot-orange: #c2410c; --star: #f5a524; --star-line: #9a4507; --star-off: #6b7c9f;
  --cta: #15803d; --cta-ink: #ffffff; --cta-deep: #0f5f2d; --ring: #2f6fe4;
  --leaf-text: #146c3e; --hint-bg: #fff3c4; --hint-ink: #8a5a00;
  --owl: #ffc83d; --owl-dark: #d9a21f; --owl-belly: #fff1c4;
  --font-display: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
  --display-weight: 800; --body-strong: 800;
  --r-card: 28px; --r-block: 24px; --r-btn: 22px; --r-sm: 16px;
  --bw: 3px; --bw-ghost: 2px; --node: 64px;
  --press: 0 5px 0 var(--shadow); --press-down: 0 2px 0 var(--shadow); --press-cta: 0 5px 0 var(--cta-deep);
  --lift: 0 6px 0 var(--shadow);
  color-scheme: light;
}
:root[data-look="focus"] {
  --sky: #f6f7fb; --card: #ffffff; --ink: #0f172a; --muted: #475569;
  --blue: #4338ca; --blue-ink: #ffffff; --blue-soft: #eef2ff; --blue-mid: #a5b4fc;
  --sun: #d97706; --sun-soft: #fef3c7; --sun-deep: #b45309; --sun-ink: #0f172a;
  --leaf: #15803d; --leaf-node: #15803d; --leaf-deep: #15803d; --leaf-soft: #e7f6ec;
  --coral: #b42318; --coral-line: #d92d20; --coral-soft: #fef0ec;
  --line: #d6dae6; --line-soft: #e5e7ef; --track: #e2e8f0; --shadow: transparent;
  --dot-blue: #4338ca; --dot-orange: #b45309; --star: #b45309; --star-line: #b45309; --star-off: #7b8798;
  --cta: #4338ca; --cta-ink: #ffffff; --cta-deep: #3730a3; --ring: #4338ca;
  --leaf-text: #166534; --hint-bg: #fef3c7; --hint-ink: #b45309;
  --font-display: "Lexend", system-ui, sans-serif;
  --font-body: "Lexend", system-ui, sans-serif;
  --display-weight: 600; --body-strong: 600;
  --r-card: 20px; --r-block: 18px; --r-btn: 14px; --r-sm: 12px;
  --bw: 1px; --bw-ghost: 1px; --node: 36px;
  --press: none; --press-down: none; --press-cta: none;
  --lift: 0 0 0 1px var(--line-soft);
}
:root[data-mode="dark"] {
  --sky: #0e1a2f; --card: #172540; --ink: #eef3ff; --muted: #a9b7d6;
  --blue: #6f9bff; --blue-ink: #0e1a2f; --blue-soft: #1e2f52; --blue-mid: #3a5a94;
  --sun: #ffd25e; --sun-soft: #5a4a1a; --sun-deep: #b8901f; --sun-ink: #13234b;
  --leaf: #4fd39a; --leaf-node: #2fb873; --leaf-deep: #1d7a4a; --leaf-soft: #173b2e;
  --coral: #ff9a76; --coral-line: #ff8a66; --coral-soft: #3d2620;
  --line: #2c3e62; --line-soft: #24365a; --track: #22314f; --shadow: #0a1424;
  --dot-blue: #7aa5ff; --dot-orange: #ffa766; --star: #ffc24d; --star-line: #ffc24d; --star-off: #7d8fb8;
  --cta: #34c77b; --cta-ink: #062814; --cta-deep: #1d7a4a; --ring: #8fb3ff;
  --leaf-text: #4fd39a; --hint-bg: #3d3416; --hint-ink: #ffd25e;
  --owl: #ffd25e; --owl-dark: #c99a22; --owl-belly: #fff0c2;
  color-scheme: dark;
}
:root[data-mode="dark"][data-look="focus"] {
  --sky: #0b1020; --card: #141a2e; --ink: #e8ecf6; --muted: #a3adc2;
  --blue: #8b93ff; --blue-ink: #0b1020; --blue-soft: #1f2547; --blue-mid: #4b52a8;
  --sun: #f5b544; --sun-soft: #3d3016; --sun-deep: #c98f2a; --sun-ink: #0b1020;
  --leaf: #4ade80; --leaf-node: #22a55a; --leaf-deep: #22a55a; --leaf-soft: #12301f;
  --coral: #ff8a7a; --coral-line: #ff8a7a; --coral-soft: #3a1f1c;
  --line: #2a3350; --line-soft: #222a44; --track: #232b45; --shadow: transparent;
  --dot-blue: #8b93ff; --dot-orange: #f5b544; --star: #f5b544; --star-line: #f5b544; --star-off: #7f8aa6;
  --cta: #8b93ff; --cta-ink: #0b1020; --cta-deep: #6b73e0; --ring: #a5acff;
  --leaf-text: #4ade80; --hint-bg: #3d3016; --hint-ink: #f5b544;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--sky); }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 18px; line-height: 1.5; }
.wrap {
  max-width: 1040px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.5rem; }
.tag { font-size: 0.85rem; color: var(--muted); }
.top .brand { margin-right: auto; }
.modebtn { min-height: 44px; padding: 0 14px; font-size: 0.9rem; }
/* On a phone the switch stays beside the name and the note goes underneath. */
@media (max-width: 520px) { .top .tag { order: 3; flex-basis: 100%; } }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 18px; align-items: start; }
.stage.solo { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 780px) { .stage { grid-template-columns: 1fr; } }
.card { background: var(--card); border-radius: var(--r-card); padding: clamp(18px, 4vw, 32px); display: grid; gap: 18px; min-width: 0; box-shadow: var(--lift); }
/* A child's screens drop the big card: each part floats on the page as its own card, as in the designs. */
.card.kid { background: none; padding: 0; box-shadow: none; border-radius: 0; }
.kid .block, .kid .bubble, .kid .visual, .kid .panel, .kid .marks, .kid .cert {
  background: var(--card); border: 0; border-radius: var(--r-block); box-shadow: var(--lift);
}
.block { display: grid; gap: 12px; padding: 18px 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: var(--display-weight); margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); }
h2 { font-size: clamp(1.4rem, 4.2vw, 1.9rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
b, strong { font-weight: var(--body-strong); }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.label { font-size: 0.75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: var(--body-strong); }
.mascot { display: flex; gap: 14px; align-items: flex-start; }
.mascot svg { flex: none; }
/* The owl belongs to the playful look; the clean look lets the question speak for itself. */
[data-look="focus"] .mascot > svg, [data-look="focus"] .cert > svg { display: none; }
.bubble { background: var(--sky); border-radius: 18px; padding: 12px 16px; min-width: 0; flex: 1; display: grid; gap: 6px; }
.kid .bubble { padding: 16px 18px; }
.prompt { font-family: var(--font-display); font-weight: var(--display-weight); font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.2; }
.visual { display: flex; justify-content: center; }
.kid .visual { padding: 14px 16px; }
.visual svg { max-width: 100%; height: auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Buttons */
.btn {
  font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.45rem; min-height: 72px; padding: 8px 16px;
  border-radius: var(--r-btn); border: var(--bw) solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  box-shadow: var(--press); transition: transform .12s, border-color .12s, box-shadow .12s;
}
.btn:active { transform: translateY(3px); box-shadow: var(--press-down); }
.btn[disabled] { cursor: default; transform: none; opacity: .55; }
.btn.right { border-color: var(--leaf); background: var(--leaf-soft); opacity: 1; }
.btn.tried, .btn.tried[disabled] { border-color: var(--coral-line); background: var(--coral-soft); color: var(--coral); opacity: 1; box-shadow: none; }
.primary { background: var(--cta); border-color: var(--cta); color: var(--cta-ink); font-size: 1.25rem; min-height: 60px; box-shadow: var(--press-cta); }
.primary:active { box-shadow: none; }
.ghost {
  font-family: var(--font-body); font-weight: var(--body-strong); font-size: 1rem; min-height: 48px; padding: 0 16px;
  border-radius: var(--r-sm); border: var(--bw-ghost) solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.ghost svg { flex: none; }
[data-look="focus"] .ghost { font-weight: 500; box-shadow: 0 1px 2px rgb(15 23 42 / 6%); }
/* Button weights for grown-up screens: tonal for the main action of a card, quiet for the rest, red only for deleting */
.ghost.tonal { background: var(--blue-soft); border-color: transparent; color: var(--blue); font-weight: 600; box-shadow: none; }
.ghost.quiet { background: none; border-color: transparent; color: var(--blue); box-shadow: none; padding: 0 10px; }
.ghost.danger { color: var(--coral); }
.ghost.danger.sure { background: var(--coral-soft); }
.ghost.danger.sure { border-color: var(--coral-line); font-weight: 600; }
/* A disabled button looks it */
.ghost[disabled] { opacity: .5; cursor: default; }
.addkid { width: 100%; min-height: 56px; background: none; border: 2px dashed var(--line); color: var(--blue); box-shadow: none; font-weight: 600; }
.member-more { border-top: 1px solid var(--line-soft); padding-top: 6px; justify-content: space-between; }
.account { justify-content: space-between; border-top: 1px solid var(--line-soft); padding-top: 10px; }
/* Hover effects only where there is a mouse: on a touch screen they stick and look like a choice already made. */
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--blue); transform: translateY(-2px); }
  .primary:hover { border-color: var(--cta); }
  .ghost:hover { border-color: var(--blue); }
  .ghost.tonal:hover { border-color: var(--blue-mid); }
  .ghost.quiet:hover, .addkid:hover { background: var(--blue-soft); }
  .ghost.danger:hover { background: var(--coral-soft); }
}
:where(.btn, .ghost, .chipbtn, .linkbtn, .say, .tapdot, .starrow, .gbtn, .tabs button):focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }

/* Answer options: big tiles in the playful look, full-width rows with A/B/C keys in the clean one */
/* One row for two or three answers, a 2×2 grid for four on a phone */
.opts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 14px; }
@media (max-width: 520px) { .opts[style*="--n:4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 380px) { .opts { gap: 10px; } .opts .btn { min-height: 96px; } }
.opts .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 112px; font-size: 3rem; line-height: 1; }
.opts .btn.long { font-size: 1.5rem; line-height: 1.15; }
.key { display: none; }
.opt-note { font-family: var(--font-body); font-size: 0.85rem; font-weight: var(--body-strong); line-height: 1.1; white-space: nowrap; }
@media (max-width: 400px) { .opt-note { font-size: 0.8rem; } }
.opt-note.ok { color: var(--leaf-text); }
.btn.right { box-shadow: 0 0 0 2px var(--leaf); }
.keyhint { display: none; }
[data-look="focus"] .opts { grid-template-columns: 1fr; gap: 10px; }
[data-look="focus"] .opts .btn { flex-direction: row; justify-content: flex-start; gap: 16px; min-height: 64px; padding: 8px 16px; font-size: 1.5rem; text-align: left; }
[data-look="focus"] .opts .btn.long { font-size: 1.2rem; }
[data-look="focus"] .key {
  display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 8px;
  background: var(--blue-soft); color: var(--blue); font-family: var(--font-body); font-weight: 600; font-size: 0.95rem;
}
[data-look="focus"] .btn.tried .key { background: var(--card); color: var(--coral); }
[data-look="focus"] .btn.right .key { background: var(--card); color: var(--leaf); }
@media (hover: hover) and (pointer: fine) { [data-look="focus"] .keyhint { display: block; text-align: center; } }

/* Feedback, and the gentle hint after a wrong first try */
.feedback { border-radius: var(--r-block); padding: 14px 16px; font-size: 1.05rem; display: flex; gap: 12px; align-items: flex-start; }
.feedback > svg { flex: none; margin-top: 2px; }
.feedback .fb-title { display: block; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.25rem; line-height: 1.25; margin-bottom: 2px; }
.feedback.good { background: var(--leaf-soft); }
.feedback.gentle { background: var(--hint-bg); }
.fb-owl { display: none; }
.fb-owl svg { width: 48px; height: 48px; }
[data-look="play"] .fb-owl { display: block; flex: none; }
[data-look="play"] .fb-icon { display: none; }
.feedback:focus { outline: none; }
.fb-note { margin-top: 8px; font-size: 0.9rem; color: var(--muted); }

/* Question progress: one chunky bar when playful, thin segments when clean */
.qtop { display: flex; align-items: center; gap: 12px; }
.qtop .qtitle { flex: 1; min-width: 0; display: grid; }
.qprog { display: flex; height: 18px; border-radius: 999px; overflow: hidden; background: var(--card); border: 3px solid var(--line); }
.qprog span { flex: 1; }
/* Done questions are a plain blue, never green: green means "right" everywhere else in the playful look. */
.qprog .done { background: var(--dot-blue); }
[data-look="focus"] .qprog { height: 6px; gap: 3px; border: 0; border-radius: 0; background: none; overflow: visible; }
[data-look="focus"] .qprog span { border-radius: 3px; background: var(--track); }
[data-look="focus"] .qprog .done { background: var(--blue); }
[data-look="focus"] .qprog .now { background: var(--blue-mid); }

/* Marks bar */
.marks { display: grid; gap: 8px; padding: 14px 18px 16px; border-radius: var(--r-block); background: var(--sky); }
.marks-top { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
.marks-num { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1; }
.delta { display: inline-block; margin-left: 8px; font-weight: var(--body-strong); font-size: 1rem; padding: 2px 10px; border-radius: 999px; }
.delta.up { background: var(--leaf-soft); color: var(--leaf-text); }
.delta.down { background: var(--coral-soft); color: var(--coral); }
.track { position: relative; height: 18px; border-radius: 999px; background: var(--track); margin-top: 18px; }
[data-look="focus"] .track { height: 10px; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--blue); transition: width .6s cubic-bezier(.3, 1.4, .5, 1), background .3s; }
.fill.qualified { background: var(--leaf); }
.passmark { position: absolute; top: -20px; bottom: -6px; width: 0; border-left: 3px dashed var(--ink); }
.passmark span { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 0.8rem; font-weight: var(--body-strong); background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; line-height: 1.4; }
[data-look="focus"] .passmark { border-left: 2px solid var(--ink); }
[data-look="focus"] .passmark span { border-width: 1px; }
.passmark.crossed { border-left-color: var(--leaf); }
.passmark.crossed span { border-color: var(--leaf); color: var(--leaf); }
.qual { font-weight: var(--body-strong); font-size: 0.95rem; }
.qual.yes { color: var(--leaf-text); }
/* Playful: a bar that fills towards a flag, nothing to read */
.marks.meter { padding: 10px 16px 12px; }
.marks.meter .track { margin-top: 10px; }
.marks.meter .passmark span { top: -14px; border: 0; background: none; padding: 0; color: var(--ink); line-height: 1; }
.marks.meter .passmark.crossed span { color: var(--leaf); }
/* Playful: one goal bar that fills to the flag at its end, and a dot for each question under it */
.marks.meter.goal { padding: 12px 40px 10px 16px; gap: 8px; }
.goal .track { margin-top: 0; }
.goalflag { position: absolute; right: -30px; top: 50%; transform: translateY(-62%); color: var(--ink); line-height: 0; }
.goalflag svg { width: 30px; height: 30px; }
.goalflag.crossed { color: var(--leaf); }
/* Reaching the flag earns one star: it pops up out of the flag */
.burststar { position: absolute; left: 50%; top: 0; transform: translateX(-50%); animation: burst .9s ease-out both; pointer-events: none; line-height: 0; }
@keyframes burst { from { opacity: 0; transform: translate(-50%, 6px) scale(.4); } 40% { opacity: 1; transform: translate(-50%, -18px) scale(1.2); } to { opacity: 0; transform: translate(-50%, -30px) scale(1); } }
.qdots { display: flex; gap: 4px; justify-content: space-between; }
.qdots span { flex: 1; max-width: 12px; height: 10px; border-radius: 999px; background: var(--track); }
.qdots .done { background: var(--dot-blue); }
/* The question showing is a ring, and stays one until Next */
.qdots .now { background: var(--card); box-shadow: inset 0 0 0 2.5px var(--ink); }
/* After the flag: the flag kept, the star it earned, and the next two stars filling */
.marks.meter.goal.starsphase { padding: 10px 16px 8px; }
.starrow { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 44px; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
.starrow .nodesay { position: static; margin-left: 4px; box-shadow: none; }
.flagdone { color: var(--leaf); line-height: 0; margin-right: 2px; }
.flagdone svg { width: 30px; height: 30px; }
.starslot { position: relative; width: 32px; height: 32px; line-height: 0; }
.starfill { position: absolute; inset: 0 auto 0 0; overflow: hidden; transition: width .6s ease-out; }
.starfill svg { width: 32px; height: 32px; max-width: none; }
/* On a phone the clean marks card is one line, a thin bar and the "How marks work" link, so the answers stay in view. */
@media (max-width: 520px) {
  [data-look="focus"] .marks { padding: 10px 14px 6px; gap: 4px; }
  [data-look="focus"] .marks .track { margin-top: 8px; height: 8px; }
  [data-look="focus"] .marks .track { margin-top: 18px; }
  /* One line: the marks, then "How?"; the tick says the pass mark, so "N more to pass" is left to the bar's label */
  [data-look="focus"] .marks { padding-top: 2px; }
  [data-look="focus"] .marks-top { flex-wrap: nowrap; }
  [data-look="focus"] .marks-top .qual { display: none; }
  .hm-long { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .howmarks .hm-short { display: inline; }
  [data-look="focus"] .marks .passmark { top: -5px; bottom: -5px; }
  [data-look="focus"] .marks .passmark span { top: -17px; font-size: 0.72rem; padding: 0 6px; line-height: 1.3; }
  [data-look="focus"] .opts .btn { min-height: 56px; }
  [data-look="focus"] .kid .bubble, [data-look="focus"] .card.kid .bubble { padding-top: 12px; padding-bottom: 12px; }
  [data-screen="kid"] .card.kid { gap: 12px; }
}
/* "How marks work" sits at the end of the marks line, and opens onto its own line */
.howmarks { margin-left: auto; }
.howmarks[open] { flex-basis: 100%; margin-left: 0; }
.howmarks summary { cursor: pointer; font-size: 0.9rem; color: var(--blue); min-height: 44px; min-width: 44px; padding: 0 4px; display: flex; align-items: center; justify-content: center; }
.hm-short { display: none; }
.marks-top:has(.howmarks[open]) { flex-wrap: wrap; }
.howmarks p { margin-top: 0; }
.lvl { display: inline-flex; gap: 6px; align-items: center; justify-self: start; font-size: 0.85rem; font-weight: var(--body-strong); padding: 4px 12px; border-radius: 999px; background: var(--blue-soft); color: var(--ink); }
.lvl i { font-style: normal; color: var(--muted); font-weight: 400; }
/* A young child doesn't need the level or what a question is worth; practice keeps its "no marks" tag. */
[data-look="play"] .lvl:not(.practice) { display: none; }

/* Grown-up panel */
.side { background: var(--card); border: 2px dashed var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; font-size: 0.95rem; }
.ladder { display: grid; gap: 6px; }
.rung { display: flex; justify-content: space-between; padding: 7px 12px; border-radius: 10px; border: 2px solid var(--line); font-variant-numeric: tabular-nums; }
.rung.on { border-color: var(--blue); background: var(--blue-soft); font-weight: var(--body-strong); }
.stat { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.tools { display: grid; gap: 8px; padding-top: 10px; border-top: 2px dashed var(--line); }
.tools .ghost { min-height: 44px; font-size: 0.9rem; }
.bankrow { display: grid; gap: 6px; }

/* Dashboard */
.dash-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.overall { display: grid; gap: 8px; }
.segs { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 6px; }
.seg { height: 16px; border-radius: 999px; background: var(--track); }
.seg.cleared { background: var(--leaf-node); }
.seg.current { background: var(--sun); }
[data-look="focus"] .segs { gap: 4px; }
[data-look="focus"] .seg { height: 8px; }
[data-look="focus"] .seg.current { background: var(--blue); }
.bigstat { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
.topics { display: grid; gap: 10px; position: relative; }
.topic { position: relative; z-index: 1; display: grid; grid-template-columns: var(--node) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-block); }
.num {
  position: relative; z-index: 0; width: var(--node); height: var(--node); border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.1rem; background: var(--track); color: var(--ink);
}
.tmain { display: grid; gap: 6px; min-width: 0; }
.tmeta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 0.88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
/* The playful trail: big round stops joined by a dotted path, the current topic on its own card */
[data-look="play"] .topics { gap: 14px; }
[data-look="play"] .topics::before {
  content: ""; position: absolute; left: calc(16px + var(--node) / 2 - 5px); top: 36px; bottom: 36px; border-left: 10px dotted var(--blue-mid);
}
[data-look="play"] .num { font-size: 1.7rem; box-shadow: 0 5px 0 var(--line); }
[data-look="play"] .topic.cleared .num { background: var(--leaf-node); color: #ffffff; box-shadow: 0 5px 0 var(--leaf-deep); }
[data-mode="dark"][data-look="play"] .topic.cleared .num { color: var(--cta-ink); }
/* Each playful stop is a button that reads its name aloud, with a small speaker badge */
button.num { border: 0; padding: 0; cursor: pointer; }
.nodesay { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: var(--blue-ink); box-shadow: 0 0 0 3px var(--sky); }
.nodesay svg { width: 15px; height: 15px; }
button.num:focus-visible { outline: 3px solid var(--ring); outline-offset: 4px; }
/* The owl's practice card, on the trail just under the next stop */
.trail-extra { position: relative; z-index: 1; padding-left: 4px; }
.trail-extra .mascot { gap: 10px; align-items: center; }
.trail-extra .owl { width: 56px; height: 56px; background: var(--sky); border-radius: 50%; }
[data-look="play"] .topic.current { background: var(--card); box-shadow: var(--lift); }
[data-look="play"] .topic.current .num { background: var(--sun); color: var(--sun-ink); box-shadow: 0 5px 0 var(--sun-deep), 0 0 0 8px var(--sun-soft); }
[data-look="play"] .topic h3 { font-size: 1.25rem; }
/* The clean list: one card per topic, and a ring that fills with the best score */
[data-look="focus"] .topics { gap: 8px; }
[data-look="focus"] .topic { background: var(--card); box-shadow: var(--lift); padding: 12px 16px; }
[data-look="focus"] .topic.current { box-shadow: 0 0 0 2px var(--blue); }
[data-look="focus"] .topic.current h3 { color: var(--blue); }
[data-look="focus"] .num { background: none; font-size: 0.95rem; }
[data-look="focus"] .num::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%;
  background: conic-gradient(var(--ringc, var(--blue)) calc(var(--p, 0) * 1%), var(--track) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px));
}
[data-look="focus"] .topic.cleared .num { --ringc: var(--leaf); color: var(--leaf); }
[data-look="focus"] .topic.locked .num { background: var(--track); }
[data-look="focus"] .topic.locked .num::before { display: none; }
.chip { font-size: 0.78rem; font-weight: var(--body-strong); padding: 2px 10px; border-radius: 999px; border: 2px solid var(--line); color: var(--muted); }
.chip.cleared { border-color: var(--leaf); color: var(--leaf-text); }
.chip.current { border-color: var(--blue); color: var(--blue); }
[data-look="focus"] .chip { border-width: 1px; }
.mini { position: relative; width: 120px; height: 8px; border-radius: 999px; background: var(--track); }
.mini b { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--blue); }
.mini b.ok { background: var(--leaf); }
.mini i { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--ink); }
/* Stars are drawn: filled with an outline when earned, only the outline when not */
.star { display: inline-block; vertical-align: middle; flex: none; }
.star path { stroke-linejoin: round; }
.star.on path { fill: var(--star); stroke: var(--star-line); stroke-width: 1.4; }
.star.off path { fill: none; stroke: var(--star-off); stroke-width: 1.8; }
.stars-sm { display: inline-flex; gap: 2px; line-height: 0; }
.starglyph { color: var(--star); -webkit-text-stroke: 1.5px var(--star-line); }
.chipbtn {
  font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.1rem; min-height: 50px; padding: 0 22px;
  border-radius: var(--r-sm); border: var(--bw-ghost) solid var(--cta); background: var(--cta); color: var(--cta-ink); cursor: pointer; box-shadow: var(--press-cta);
}
.chipbtn:active { transform: translateY(3px); box-shadow: none; }
.chipbtn.soft { background: var(--card); color: var(--ink); border-color: var(--line); box-shadow: var(--press); }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.panel { border: var(--bw-ghost) solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.area { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.area .mini { width: 100%; grid-column: 1 / -1; }
.lvlrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.lvlrow .mini { width: 100%; }
.stars { display: flex; justify-content: center; gap: 8px; line-height: 0; }
.stars .on { animation: starpop .45s calc(var(--i) * .35s + .2s) both; }
@keyframes starpop { from { transform: scale(0); opacity: 0; } 70% { transform: scale(1.25); } to { transform: scale(1); opacity: 1; } }
.center { text-align: center; }
.cert { border: 3px solid var(--sun); border-radius: 24px; padding: 24px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.cert .say { position: static; }
/* The certificate: a tick for every topic in the class */
.ticks { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.ticks span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--leaf); color: #ffffff; font-weight: 800; }
[data-mode="dark"] .ticks span { color: var(--sky); }
.kid .cert { border: 3px solid var(--sun); }
@media (max-width: 520px) {
  .topic { grid-template-columns: var(--node) minmax(0, 1fr); }
  .topic .act { grid-column: 2; }
  .topic .act .chipbtn { width: 100%; }
}

/* Sign-in, consent, PIN, profiles and onboarding */
.narrow { max-width: 560px; margin: 0 auto; width: 100%; display: grid; gap: 18px; }
.hero { display: grid; justify-items: center; text-align: center; gap: 10px; }
.wide { width: 100%; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.9rem; }
.or::before, .or::after { content: ""; flex: 1; border-top: 2px solid var(--line); }
form { display: grid; gap: 10px; }
label { font-weight: var(--body-strong); }
input[type="email"], input[type="text"] {
  font: inherit; font-size: 1.15rem; min-height: 56px; padding: 0 16px; border-radius: var(--r-sm);
  border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 100%;
}
input:focus-visible, select:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.error { color: var(--coral); font-weight: var(--body-strong); }
.note { background: var(--sky); border-radius: 14px; padding: 12px 14px; font-size: 0.95rem; }
.kid .note, .kid .banner { box-shadow: var(--lift); }
.kid .note { background: var(--card); }
.points { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; cursor: pointer; }
.check input { width: 26px; height: 26px; flex: none; margin-top: 2px; accent-color: var(--blue); }
.pin-dots { display: flex; justify-content: center; gap: 16px; }
.pin-dots span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); }
.pin-dots span.on { background: var(--ink); }
.pinpad { display: grid; grid-template-columns: repeat(3, minmax(0, 88px)); justify-content: center; gap: 12px; }
.pinpad .btn { min-height: 64px; font-size: 1.6rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.choices.avatars { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.choices .btn { min-height: 80px; }
.choices .btn.on { border-color: var(--blue); background: var(--blue-soft); }
.choices .btn small { display: block; font-family: var(--font-body); font-size: 0.85rem; font-weight: var(--body-strong); color: var(--muted); }
.emoji { font-size: 2.4rem; line-height: 1; }
.steps { display: flex; gap: 6px; }
.steps span { flex: 1; height: 8px; border-radius: 999px; background: var(--track); }
.steps span.on { background: var(--blue); }
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .kids { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kid-btn { display: grid; justify-items: center; gap: 6px; padding: 18px 12px; min-height: 150px; }
.kid-btn .emoji { font-size: 3.2rem; }
.who { display: flex; align-items: center; gap: 10px; }
.who .emoji { font-size: 2rem; }
.kid .who .emoji { width: 52px; height: 52px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 1.9rem; box-shadow: var(--lift); }
.who b { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.4rem; }
.family { display: grid; gap: 10px; }
.member { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px; align-items: center; padding: 14px 16px 8px; border: var(--bw-ghost) solid var(--line); border-radius: 16px; }
.member .row { grid-column: 1 / -1; }
/* On phones each pair of buttons shares one line, and a pair that can't fit stacks full width */
@media (max-width: 520px) {
  .member { padding: 12px 12px 6px; }
  .member .row { gap: 8px; }
  .member .row > .ghost { gap: 6px; }
  .member .row > .ghost:not(.quiet) { flex: 1 1 auto; padding: 0 12px; }
  .member-more .ghost.quiet { padding: 0 8px; }
}
/* The longer half of a label, left out when the screen is very narrow */
@media (max-width: 380px) { .roomy { display: none; } }
.banner { background: var(--coral-soft); border-radius: 14px; padding: 10px 14px; font-weight: var(--body-strong); }
pre.data { max-height: 240px; overflow: auto; background: var(--sky); border-radius: 12px; padding: 12px; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; }
@media (max-width: 420px) { .choices.avatars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* New questions, settings and the admin panel */
.act { display: grid; gap: 4px; justify-items: end; }
/* Two buttons on a stop ("Practise first" and "Try again") sit side by side at one width when there's room */
@media (min-width: 521px) { .topic .act:has(> .chipbtn + .chipbtn) { grid-auto-flow: column; gap: 8px; } .topic .act:has(> .chipbtn + .chipbtn) .chipbtn { min-width: 160px; } }
.linkbtn { font: inherit; font-size: 0.88rem; font-weight: var(--body-strong); min-height: 44px; padding: 0 6px; border: 0; background: none; color: var(--blue); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.linkbtn[disabled] { color: var(--muted); cursor: default; }
.linkbtn:focus-visible { border-radius: 6px; }
/* A link inside a sentence keeps a 44px tap area without opening a gap in the lines around it */
p > .linkbtn { min-height: 0; padding-block: 12px; margin-block: -12px; vertical-align: baseline; }
.settings { display: grid; gap: 12px; }
.setting { border: var(--bw-ghost) solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
.setline { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper .ghost { min-width: 56px; min-height: 52px; padding: 0; font-size: 1.5rem; }
.stepper .ghost[disabled] { opacity: .4; cursor: default; }
.stepper b { min-width: 2.2ch; text-align: center; font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stepper b small { display: block; font-family: var(--font-body); font-size: 0.75rem; font-weight: 400; color: var(--muted); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tabs .ghost.on { background: var(--blue-soft); border-color: var(--blue); }
.looks { display: grid; gap: 10px; }
.looks .ghost { justify-content: flex-start; text-align: left; min-height: 56px; padding: 10px 14px; }
.looks .ghost.on { background: var(--blue-soft); border-color: var(--blue); }
.looks .ghost small { display: block; font-weight: 400; color: var(--muted); }
.swatch { width: 28px; height: 28px; border-radius: 8px; flex: none; }
.swatch.play { background: linear-gradient(135deg, #ffc83d 0 50%, #2f6fe4 50% 100%); border-radius: 50%; }
.swatch.focus { background: linear-gradient(135deg, #4338ca 0 50%, #e2e8f0 50% 100%); }
.qcard { border: var(--bw-ghost) solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.optlist { display: flex; gap: 8px; flex-wrap: wrap; }
.optlist span { min-width: 48px; text-align: center; padding: 4px 12px; border-radius: 12px; border: 2px solid var(--line); font-weight: var(--body-strong); }
/* The stored answer is the question's key, neutral until a check disagrees with it */
.optlist span.anskey { border-color: var(--ink); }
.optlist span.anskey.bad { border-color: var(--coral-line); background: var(--coral-soft); color: var(--coral); }
.optlist span.anskey.unchecked, .optlist span.repeat { border-color: var(--hint-ink); background: var(--hint-bg); color: var(--hint-ink); }
.problems { margin: 0; padding: 10px 14px 10px 32px; border-radius: 14px; background: var(--coral-soft); display: grid; gap: 4px; font-size: 0.95rem; }
/* A family's own questions: the file picker, the upload's preview, and a tick box's small print. */
.filepick { display: grid; gap: 6px; margin-top: 12px; }
.filepick input[type=file] { width: 100%; box-sizing: border-box; font: inherit; min-height: 48px; padding: 10px; border: var(--bw-ghost) dashed var(--line); border-radius: 14px; background: var(--card); color: var(--ink); max-width: 100%; }
.filepick input[type=file]::file-selector-button { font: inherit; font-weight: var(--body-strong); margin-right: 12px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--sky); color: var(--ink); cursor: pointer; }
.panel.preview { margin-top: 12px; display: grid; gap: 10px; }
.panel.preview p { margin: 0; }
.block-sub { display: block; font-size: 0.9rem; color: var(--muted); margin-top: 2px; }
.nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; }
.nums label { display: grid; gap: 4px; font-size: 0.85rem; }
.limits { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.limits legend { padding: 0; margin-bottom: 4px; font-weight: var(--body-strong); }
.limits label { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: center; font-weight: 400; }
.classgrid { display: grid; grid-template-columns: minmax(0, 1fr) 96px 96px; gap: 8px 12px; align-items: center; }
.classgrid .label { align-self: end; }
input[type="number"], select {
  font: inherit; font-size: 1.05rem; font-weight: 400; min-height: 48px; padding: 0 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--card); color: var(--ink); width: 100%; min-width: 0;
}
.log { display: grid; gap: 6px; font-size: 0.88rem; }
.log > div { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.4fr) minmax(0, 0.9fr) minmax(0, 1.2fr); gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--sky); font-variant-numeric: tabular-nums; }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 0.95rem; }
.checks .ok { color: var(--leaf); }
.checks .bad { color: var(--coral); font-weight: var(--body-strong); }
@media (max-width: 520px) {
  .topic .act { justify-items: stretch; }
  .log > div { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

/* "Press back again to leave Nitya" */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 10; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--card); font-size: 0.95rem; font-weight: 600; box-shadow: 0 6px 20px rgb(0 0 0 / 25%); }

/* Screen reader messages */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* A child's screens: the Dark switch is a small icon in the playful look, and the demo note is hidden on phones */
[data-look="play"][data-screen="kid"] .modebtn { width: 44px; padding: 0; }
[data-look="play"][data-screen="kid"] .mode-lbl { display: none; }
@media (max-width: 520px) { [data-screen="kid"] .top .tag { display: none; } }
[data-screen="kid"] .card.kid { gap: 14px; }
.card.enter { animation: fadein .15s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* The grown-ups strip */
.gbar { display: inline-flex; align-items: center; gap: 8px; justify-self: start; padding: 6px 12px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); font-size: 0.85rem; font-weight: 600; }
.backlink { padding-left: 4px; }

/* The speaker on a speech bubble */
.bubble { position: relative; }
.bubble:has(> .say) { padding-right: 76px; }
.say { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; cursor: pointer; color: var(--blue-ink); background: var(--blue); border: 0; width: 56px; height: 56px; border-radius: 50%; box-shadow: 0 4px 0 var(--cta-deep); }
[data-look="play"] .say { background: var(--blue); box-shadow: 0 4px 0 #1f4fae; }
[data-look="focus"] .say { width: 44px; height: 44px; border-radius: 12px; background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
[data-look="focus"] .bubble:has(> .say) { padding-right: 64px; }
@media (max-width: 420px) { [data-look="play"] .say { width: 48px; height: 48px; } [data-look="play"] .bubble:has(> .say) { padding-right: 66px; } }
.seq { white-space: nowrap; }

/* The quiz and check bars: Lesson and Stop, and the stop question */
.iconbtn { padding: 0 12px; }
@media (max-width: 420px) { .iconbtn { width: 48px; padding: 0; } .iconbtn .lbl { display: none; } }
.confirm { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r-block); background: var(--card); border: 2px solid var(--blue); }
.confirm .row .btn { min-height: 52px; font-size: 1.1rem; }
.confirm { position: relative; }
.confirm:has(> .say) { padding-right: 76px; }
.confirm .row svg { flex: none; }
.confirm .row .btn, .confirm .row .ghost { display: inline-flex; align-items: center; gap: 8px; }
[data-look="focus"] .confirm:has(> .say) { padding-right: 64px; }

/* Result and lesson buttons: a stack of full-width buttons on a phone */
@media (max-width: 520px) { .row.actions { display: grid; grid-template-columns: minmax(0, 1fr); } .row.actions > * { width: 100%; } }
.wide { width: 100%; }

/* Lesson dots a child can tap to count */
.tapdots { flex-direction: column; align-items: center; gap: 14px; }
/* A short last row starts at the left, as in a ten-frame, so no dot sits alone in the middle */
.dotgroup { display: grid; grid-template-columns: repeat(var(--cols, 5), 46px); gap: 8px; }
/* Groups are set apart by a line: under each other in the lesson, side by side in a quiz */
.tapdots:not(.compact) .dotgroup + .dotgroup { border-top: 2px solid var(--line); padding-top: 14px; }
.dotgroup.frame { padding: 8px; border: 2px solid var(--ink); border-radius: 12px; }

.grouptotal { grid-column: 1 / -1; min-height: 28px; text-align: center; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.25rem; line-height: 28px; color: var(--ink); }
.dotbox { display: grid; justify-items: center; gap: 2px; }

.tapdot { width: 46px; height: 46px; border-radius: 50%; border: 0; cursor: pointer; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.2rem; color: #ffffff; }
.tapdot.blue { background: var(--dot-blue); }

.tapdot { position: relative; }
/* A crossed-out dot is only a picture: faded, with a cross, and it can't be counted */
.tapdot.crossed { display: inline-block; opacity: .45; cursor: default; }
.tapdot.crossed::before, .tapdot.crossed::after { content: ""; position: absolute; left: 16%; right: 16%; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--ink); transform: rotate(45deg); }
.tapdot.crossed::after { transform: rotate(-45deg); }

.tapdots.compact { flex-direction: row; flex-wrap: nowrap; justify-content: center; gap: 10px 12px; }
.tapdots.compact .dotgroup + .dotgroup { border-left: 2px solid var(--line); padding-left: 12px; }
.tapdots.compact .dotgroup { display: grid; grid-template-columns: repeat(var(--cols, 5), 40px); gap: 6px; }
.tapdots.compact .tapdot { width: 40px; height: 40px; font-size: 1.05rem; }
/* A hint's amount, drawn as dots in rows of 5 */
/* Hollow rings in a frame, so they read as a picture and not as dots to tap */
.hintdots { display: grid; width: max-content; grid-template-columns: repeat(var(--cols, 5), 24px); gap: 6px; margin: 8px 0; padding: 6px; border: 2px solid var(--hint-ink); border-radius: 10px; }
.hintdots i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--dot-blue); box-sizing: border-box; }

[data-mode="dark"] .tapdot { color: #0e1a2f; }
.btn.ready { animation: pulse 1s ease-in-out 2; }

@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* Carry on, and the clean look's one-line topic rows */
.carry { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.carry > div { display: grid; gap: 2px; }

/* An open topic is one button: ring, the title on one line, the score under it, and a chevron */
.rowbtn { width: 100%; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.rowbtn .tmain { gap: 2px; }
/* Up to two lines, so a long title like "Taking away with objects up to 10" keeps its end */
.ttl { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Sign-in with Google, in Google's own button style */
.gbtn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 52px; border-radius: 999px; border: 1px solid #747775; background: #ffffff; color: #1f1f1f; font: 500 1.05rem "Roboto", "Lexend", system-ui, sans-serif; cursor: pointer; }

/* PIN pad: Cancel bottom left, 0 in the middle, delete bottom right */
.pinpad .pinside { min-height: 64px; padding: 0 8px; font-size: 1rem; }

/* Onboarding */
.stepline { display: grid; gap: 6px; }
.choices .btn small.sub { font-size: 0.8rem; font-weight: 400; }

/* Segmented choices in settings */
.sublabel { font-weight: var(--body-strong); font-size: 0.95rem; }
.segctl { display: flex; flex-wrap: nowrap; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.segctl .ghost { flex: 1 1 0; min-width: 0; min-height: 52px; border: 0; border-radius: 0; border-right: 1px solid var(--line); box-shadow: none; flex-direction: column; gap: 0; padding: 4px 8px; line-height: 1.2; }
/* The pass mark: a 2×2 grid of choices on a phone, one row when there is room */
.choicegrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .choicegrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.choicegrid .ghost small { font-size: 0.8rem; font-weight: 400; color: var(--muted); }

.choicegrid .ghost.on small { color: var(--blue-ink); }
@media (max-width: 400px) { .setting { padding: 12px; } .card { padding-left: 14px; padding-right: 14px; } }
.segctl .ghost:last-child { border-right: 0; }
.segctl .ghost small { font-size: 0.75rem; font-weight: 400; color: var(--muted); }
.segctl .ghost.on { background: var(--blue); color: var(--blue-ink); }
.segctl .ghost.on small { color: var(--blue-ink); }
label.inline { font-weight: 400; }
.setting input[type="number"] { width: 96px; }
.live { font-size: 0.95rem; }
.warn { background: var(--hint-bg); border-radius: 12px; padding: 10px 12px; font-size: 0.95rem; }
.danger-zone { border-color: var(--coral-line); }
/* Withdraw consent sits apart from everything else on the page */
.danger-zone.apart { margin-top: 22px; }
.datasum { display: grid; gap: 10px; }
.datasum summary { cursor: pointer; color: var(--blue); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.answerpick .check { min-height: 44px; align-items: center; margin-top: 6px; }
@media print { .top, .side, .gbar, button { display: none !important; } }

/* Progress page and the privacy notice */
.prow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.pmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

.disc[open] { display: grid; gap: 4px; }
.notice { display: grid; gap: 4px; }

/* Admin: tabs as one segmented control, and a Save bar that stays in view */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--track); }
.tabs button { flex: 1 1 40%; min-height: 44px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; font-size: 0.95rem; font-weight: 500; cursor: pointer; padding: 0 12px; }
.tabs button.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 3px rgb(15 23 42 / 15%); }

details.panel > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
.qcard details summary, .panel details summary { cursor: pointer; color: var(--blue); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.sticky-save { position: sticky; bottom: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; background: var(--card); border-top: 1px solid var(--line-soft); }
/* Phones: the playful owl is a little smaller and its speaker sits under it, so the question gets the bubble's full

  [data-look="play"] .mascot { gap: 10px; }

}

@media (max-width: 520px) { [data-quiz] .top { display: none; } [data-quiz] .wrap { padding-top: 12px; } }

}
